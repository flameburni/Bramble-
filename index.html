<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale = 1.0">
    <meta name="theme-color" content="#e2622a">
    <title>Bramble</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Bramble</h1>
    <div class="search-bar">
    <input type="search" id="searchBox" placeholder="Enter an ingredient">
    <button id="searchBtn">Search</button>
    <button id="favoritesBtn">My Favorites</button>
    </div>
    <p id="errorMsg" class="notice" style="display: none">Please enter an ingredient.</p>
    <p id="errorMsg2" class="notice" style="display: none">No recipes found!</p>
    <p id="errorMsg3" class="notice" style="display: none">No favorites found!</p>
    <p id="errorMsg4" class="notice" style="display: none">Unable to connect. Please check your internet connection.</p>
    <div id="searchResults"></div>
    <div id="favoritesResults"></div>
    <div id="recipeDetail"></div>
    <script src="script.js"></script>
  </body>
</html>
